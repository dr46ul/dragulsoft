version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    # The setup action pins actions too, and Dependabot only reads workflows from /.
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
