name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs CI on a branch without opening a PR: `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    env:
      NO_COLOR: 1
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.task == 'test'
        run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm ${{ matrix.task }}
