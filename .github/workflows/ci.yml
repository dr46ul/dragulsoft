name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs CI on a branch without opening a PR: `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, build]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm ${{ matrix.task }}

  test-project:
    name: test:${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [unit, nuxt, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.project == 'e2e' }}
      # Without NUXT_TEST_HOST every e2e file builds the app for itself, so build and serve it once.
      - if: matrix.project == 'e2e'
        run: |
          pnpm build
          HOST=$E2E_HOST PORT=$E2E_PORT node .output/server/index.mjs &
          curl --retry 30 --retry-connrefused --retry-delay 1 -sf -o /dev/null "http://$E2E_HOST:$E2E_PORT"
          echo "NUXT_TEST_HOST=http://$E2E_HOST:$E2E_PORT" >> "$GITHUB_ENV"
      - run: pnpm test:${{ matrix.project }}

  # main's branch protection requires a check named `test`, so it stands for every test project passing.
  test:
    needs: test-project
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.test-project.result != 'success'
        run: exit 1
