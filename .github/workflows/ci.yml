name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs CI on a branch without opening a PR: `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# On a Markdown-only pull request, jobs skip their steps rather than being skipped: required checks match by name, and
# a skipped matrix job reports as `matrix.task`. A job deciding for the others would delay every code PR by ~7s.
jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      # ESLint lints Markdown too.
      - if: matrix.task == 'lint' || steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup
      - if: matrix.task == 'lint' || steps.changes.outputs.code == 'true'
        run: pnpm ${{ matrix.task }}

  test-project:
    name: test:${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [unit, nuxt]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      - if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup
      - if: steps.changes.outputs.code == 'true'
        run: pnpm test:${{ matrix.project }}

  # The runner is CPU-bound on the browser tests, so splitting them across runners is what shortens the job.
  e2e:
    name: test:e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      - if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup
        with:
          browsers: true
      # Without NUXT_TEST_HOST every e2e file builds the app for itself, so build and serve it once.
      - if: steps.changes.outputs.code == 'true'
        run: |
          pnpm build
          HOST=$E2E_HOST PORT=$E2E_PORT node .output/server/index.mjs &
          curl --retry 30 --retry-connrefused --retry-delay 1 -sf -o /dev/null "http://$E2E_HOST:$E2E_PORT"
          echo "NUXT_TEST_HOST=http://$E2E_HOST:$E2E_PORT" >> "$GITHUB_ENV"
      - if: steps.changes.outputs.code == 'true'
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # main's branch protection requires a check named `test`, so it stands for every test job passing.
  test:
    needs: [test-project, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
