name: Changes
description: Tells whether a pull request changes anything besides Markdown. Needs a checkout with fetch-depth 2.

outputs:
  code:
    description: "'false' when a pull request changes only Markdown files; 'true' otherwise, and for every push or dispatch."
    value: ${{ steps.diff.outputs.code }}

runs:
  using: composite
  steps:
    # A pull_request checkout is the merge commit, whose first parent is the base it merges into. Nothing the app,
    # its build or its tests read is Markdown. If the diff can't be taken, everything runs.
    - id: diff
      shell: bash
      run: |
        if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet HEAD^1 HEAD -- ':(exclude)*.md'; then
          echo code=false >> "$GITHUB_OUTPUT"
        else
          echo code=true >> "$GITHUB_OUTPUT"
        fi
