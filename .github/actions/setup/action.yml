name: Setup
description: Loads .github/ci.env, installs Node and pnpm, and installs the dependencies.

inputs:
  browsers:
    description: Also install Chromium for the e2e tests.
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      run: grep -Ev '^[[:space:]]*(#|$)' "$GITHUB_WORKSPACE/.github/ci.env" >> "$GITHUB_ENV"
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.browsers == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(pnpm exec playwright-core --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - if: inputs.browsers == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    # The runner image ships Google Chrome, so Chromium's system libraries are already there and --with-deps only
    # adds an apt install that can hang. The tests run headless, which needs only the headless shell.
    - if: inputs.browsers == 'true'
      shell: bash
      run: pnpm exec playwright-core install --only-shell chromium
